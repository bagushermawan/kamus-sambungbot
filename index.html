<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kamus Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        background-color: #0f0f14;
        color: #fff;
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* Layout Input Bersebelahan & Tombol X */
      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .input-wrapper {
        position: relative;
        flex: 1;
        display: flex;
      }

      input {
        width: 100%;
        padding: 12px;
        padding-right: 35px; /* Beri ruang untuk tombol X */
        border-radius: 8px;
        border: 1px solid #333;
        background: #1a1a24;
        color: #00d4ff;
        font-size: 16px;
        min-width: 0;
        box-sizing: border-box;
      }
      input::placeholder {
        color: #666;
        font-size: 14px;
      }

      /* Tombol Silang (Clear) */
      .clear-btn {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #888;
        font-size: 16px;
        padding: 5px 10px;
        cursor: pointer;
        display: none; /* Awalnya sembunyi */
      }
      .clear-btn:active {
        color: #fff;
      }

      /* Info & Counter */
      .header-info {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #888;
        margin-bottom: 10px;
      }

      /* Pagination */
      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1a1a24;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .pagination button {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        background: #00d4ff;
        color: black;
        font-weight: bold;
        cursor: pointer;
      }
      .pagination button:disabled {
        background: #333;
        color: #666;
      }
      .page-info {
        font-weight: bold;
        color: #fff;
      }

      /* Daftar Kata */
      .list-container {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 10px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #222;
        background: #16161e;
        border-radius: 8px;
        margin-bottom: 6px;
      }
      .item-text {
        font-size: 18px;
        font-weight: bold;
        color: #00e676;
        letter-spacing: 1px;
      }

      .copy-btn {
        padding: 8px 15px;
        border-radius: 6px;
        border: none;
        background: #333;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      .copy-btn:active {
        background: #00e676;
        color: black;
      }

      /* Toast & Loader */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #00e676;
        color: black;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: bold;
        display: none;
        z-index: 1000;
        white-space: nowrap;
      }
      #cloud-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f0f14;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .item-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .item-number {
        color: #7b2cbf;
        font-weight: bold;
        font-size: 14px;
        min-width: 25px; /* Biar nomor tetap sejajar meski angka bertambah */
      }
      .item-text {
        font-size: 18px;
        font-weight: bold;
        color: #00e676;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="cloud-loader">
      <h2 style="color: #00d4ff">☁️ Loading some words...</h2>
      <p id="loader-text">Loading data from the cloud</p>
    </div>

    <div id="toast" class="toast">Notifikasi</div>

    <div class="input-row">
      <div class="input-wrapper">
        <input
          type="text"
          id="prefixInput"
          placeholder="Awalan (Cth: MI)"
          autocomplete="off"
        />
        <button class="clear-btn" id="clearPrefix">✕</button>
      </div>
      <div class="input-wrapper">
        <input
          type="text"
          id="suffixInput"
          placeholder="Akhiran (Cth: AL)"
          autocomplete="off"
        />
        <button class="clear-btn" id="clearSuffix">✕</button>
      </div>
    </div>

    <div class="header-info">
      <span id="counter">Loading...</span>
    </div>

    <button
      id="openSumbangBtn"
      style="
        width: 100%;
        padding: 10px;
        background: #7b2cbf;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        margin-bottom: 10px;
      "
    >
      ➕ Tambah Kata
    </button>

    <div id="sumbangModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">
  <div style="background:#1a1a24; padding:20px; border-radius:12px; width:100%; max-width:400px; border:1px solid #333;">
    <h3 style="margin-top:0; color:#00d4ff;">Tambah Kata</h3>
    <p style="font-size:12px; color:#888;">Tambah Kata baru cuy.</p>
    
    <input type="text" id="inputSumbangNama" placeholder="Nickname Kamu..." style="margin-bottom:10px; width:100%; box-sizing:border-box;">
    
    <input type="text" id="inputSumbangKata" placeholder="Masukkan kata baru..." style="margin-bottom:15px; width:100%; box-sizing:border-box;">
    
    <div style="display:flex; gap:10px;">
      <button id="kirimSumbangBtn" style="flex:2; background:#00e676; color:black; font-weight:bold; padding:12px; border-radius:8px; border:none; cursor:pointer;">Kirim</button>
      <button id="tutupModalBtn" style="flex:1; background:#333; color:white; padding:12px; border-radius:8px; border:none; cursor:pointer;">Batal</button>
    </div>
  </div>
</div>

    <div class="pagination" id="paginationBox" style="display: none">
      <button id="prevBtn">◀ Prev</button>
      <span class="page-info" id="pageInfo">Hal 1 / 1</span>
      <button id="nextBtn">Next ▶</button>
    </div>

    <div class="list-container" id="list"></div>

    <script src="app.js"></script>
  </body>
</html>
